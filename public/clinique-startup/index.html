<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Clinique Startup, l'espace de travail (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A6B;--ink:#13203B;--blue:#1D5BD8;--lime:#B7E234;--green:#22B455;--bg:#F3F6FA;--grey:#5B6B82;--line:#E2E8F1;--mint:#E8F7EC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.p{font-family:Poppins,Inter,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
.tuile{display:grid;place-items:center;border-radius:14px;color:#fff;flex:none}
.tuile svg{width:55%;height:55%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:4px 11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:14px;font-weight:600;font-size:15px;font-family:Poppins,sans-serif}
.btn.pri{background:var(--navy);color:#fff}.btn.lime{background:var(--lime);color:var(--navy)}.btn.sec{background:#fff;border:1px solid var(--line)}
/* ---------- parcours d'entrée ---------- */
.entree{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,#1D5BD8 0,transparent 60%),linear-gradient(160deg,#0B2A6B,#0E3A91);color:#fff;display:flex;flex-direction:column}
.e-haut{display:flex;align-items:center;gap:14px;padding:22px 40px}
.e-haut .esp{flex:1}.e-haut img{height:26px;filter:brightness(0) invert(1);opacity:.9}
.logo{display:flex;align-items:center;gap:10px}.logo .tuile{width:38px;height:38px;border-radius:11px;background:var(--navy);color:var(--lime)}
.logo b{font-family:Poppins;font-weight:800;font-size:17px;white-space:nowrap}.logo small{display:block;font-size:11px;opacity:.7}
.entree .logo .tuile{background:rgba(255,255,255,.12)}
.etapes-e{display:flex;gap:8px;align-items:center;font-size:13px}
.etapes-e span{display:flex;align-items:center;gap:6px;opacity:.55}.etapes-e span.on{opacity:1;font-weight:600}
.etapes-e span b{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:12px}
.etapes-e span.on b,.etapes-e span.fait b{background:var(--lime);color:var(--navy)}
.e-corps{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 40px 60px}
.e-grille{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;max-width:1160px;width:100%}
.e-k{font-family:Poppins;font-weight:800;font-size:110px;line-height:.9;color:var(--lime);letter-spacing:-.04em}
.e-k small{font-size:28px;color:#fff;letter-spacing:0;display:inline-block;margin-left:14px;line-height:1.1;vertical-align:middle}
.e-lead{font-size:18px;line-height:1.55;opacity:.92;margin-top:18px;max-width:600px}.e-lead b{color:#fff}
.e-ctas{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.qrcard{background:#fff;color:var(--ink);border-radius:26px;padding:26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.qrcard small{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.08em;text-transform:uppercase}
.qrcard h3{font-size:22px;margin:4px 0 14px}
.qrcard svg.qr{width:230px;height:230px}
.qrcard p{font-size:13px;color:var(--grey);margin-top:10px}
.choix-wrap{max-width:980px;width:100%;text-align:center}
.choix-wrap h1{font-size:44px;line-height:1.1;font-weight:800}
.choix-wrap>p{font-size:17px;opacity:.85;margin-top:10px}
.choix{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px;text-align:left}
.choix.q4{grid-template-columns:repeat(4,1fr)}
.choix button{background:#fff;color:var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;min-height:190px;border:3px solid transparent;transition:transform .15s,border-color .15s}
.choix button:hover{transform:translateY(-3px);border-color:var(--lime)}
.choix button .tuile{width:52px;height:52px}
.choix button b{font-family:Poppins;font-size:19px}
.choix button small{font-size:14px;color:var(--grey);line-height:1.45}
.retour{margin-top:26px;display:inline-flex;align-items:center;gap:6px;opacity:.8;font-size:14px}
/* ---------- espace de travail ---------- */
.app{display:grid;grid-template-columns:272px 1fr;height:100vh}
.menu{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:2px;min-height:0}
.menu .logo{padding:4px 8px 16px}.menu .logo b{color:var(--navy)}.menu .logo small{color:var(--grey)}
.menu a{display:flex;align-items:center;gap:10px;min-height:44px;border-radius:12px;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.menu a:hover{background:#F3F6FA}.menu a.on{background:#E9EEF8;color:var(--navy)}
.menu h6{font-size:11.5px;font-weight:700;color:var(--grey);letter-spacing:.08em;text-transform:uppercase;padding:16px 10px 6px}
.menu .liste{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:2px}
.menu .liste a .tuile{width:32px;height:32px;border-radius:10px}
.menu .liste a span.mt{flex:1;min-width:0;line-height:1.2}
.menu .liste a small{font-size:11.5px;font-weight:500;color:var(--grey);display:block}
.menu .liste a .ok{width:18px;height:18px;border-radius:99px;background:var(--green);color:#fff;display:grid;place-items:center}
.menu .liste a .ok svg{width:12px;height:12px}
.menu .pied{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.powered{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--grey);padding:4px 0}.powered img{height:22px}
.zone{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;overflow:auto;padding:28px 36px 48px}
.page-in{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.carte{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.tete-tel{display:none}
/* tracker */
.suivi{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:stretch}
.bonjour{background:linear-gradient(130deg,#0B2A6B,#1D5BD8);color:#fff;border-radius:24px;padding:26px 28px;position:relative;overflow:hidden}
.bonjour h1{font-size:30px;font-weight:800}
.bonjour .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.bonjour .chips span{background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.barre{height:12px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:22px;overflow:hidden}.barre i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .5s}
.bonjour .chiffres{display:flex;gap:26px;margin-top:12px;font-size:14px;opacity:.95}.bonjour .chiffres b{font-family:Poppins;font-size:22px;color:var(--lime);margin-right:4px}
.reprendre{display:flex;flex-direction:column;justify-content:space-between;border:2px solid var(--lime);background:#FAFDF0}
.reprendre small{font-size:12px;font-weight:700;color:#5c7a00;letter-spacing:.06em;text-transform:uppercase}
.reprendre h3{font-size:19px;margin-top:6px;line-height:1.3}.reprendre p{font-size:13.5px;color:var(--grey);margin-top:4px}
.frise{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;position:relative;margin-top:16px}
.frise:before{content:"";position:absolute;left:5%;right:5%;top:27px;height:4px;background:var(--line);border-radius:9px}
.f-et{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;cursor:pointer}
.f-et .tuile{width:56px;height:56px;border-radius:18px;box-shadow:0 0 0 6px #fff;position:relative}
.f-et .tuile.gris{background:#EEF1F6!important;color:#9aa6b8}
.f-et .badge{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:99px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}.f-et .badge svg{width:13px;height:13px}
.f-et b{font-size:12.5px;line-height:1.25;font-weight:600}.f-et small{font-size:11.5px;color:var(--grey)}
.f-et.reco .tuile{box-shadow:0 0 0 6px #fff,0 0 0 9px var(--lime)}
.cartes-et{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.c-et{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;border-top:5px solid}
.c-et .h{display:flex;align-items:center;justify-content:space-between}.c-et .tuile{width:46px;height:46px}
.c-et h3{font-size:19px}.c-et p{font-size:13.5px;color:var(--grey);line-height:1.45}
.c-et .tl{display:flex;flex-direction:column;gap:5px}
.c-et .tl span{display:flex;align-items:center;gap:8px;font-size:13px}
.c-et .tl span i{width:18px;height:18px;border-radius:99px;border:1.5px dashed #c3c9d6;flex:none;display:grid;place-items:center}
.c-et .tl span.fait{color:var(--grey)}.c-et .tl span.fait i{background:var(--green);border:0;color:#fff}.c-et .tl span.fait i svg{width:11px;height:11px}
.rep{display:flex;gap:10px;background:var(--mint);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:#14532d}
.rep small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#15803d}
.c-et .go{margin-top:auto;height:44px;border-radius:12px;color:#fff;font-weight:600;font-family:Poppins;display:flex;align-items:center;justify-content:center;gap:8px}
.reco-badge{background:var(--lime);color:var(--navy)}
/* étape */
.e-tete{display:flex;align-items:center;gap:14px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line)}
.e-tete .tuile{width:48px;height:48px}
.e-tete h2{font-size:21px;line-height:1.15}.e-tete .esp{flex:1}
.onglets{display:flex;gap:4px;background:#F3F6FA;border-radius:12px;padding:4px}
.onglets button{height:36px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--grey)}.onglets button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.taches{display:flex;gap:10px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.t{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:8px 14px 8px 10px;flex:1;min-width:180px;text-align:left;background:#fff}
.t .e{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px;border:1.5px dashed #c3c9d6;color:#9aa6b8}
.t small{font-size:11px;color:var(--grey);display:block}.t b{font-size:13.5px;display:block;line-height:1.25}
.t.fait .e{background:#E3F6EA;border:0;color:#15803d}.t.fait .e svg{width:14px;height:14px}
.t.cours{border-color:var(--c)}.t.cours .e{background:var(--c);border:0;color:#fff}
.corps{flex:1;display:flex;min-height:0}
.discussion{flex:1;display:flex;flex-direction:column;min-width:0;background:#F7F9FC}
.fil{flex:1;overflow:auto;padding:24px 32px;display:flex;flex-direction:column;gap:14px}
.ligne{display:flex;gap:10px;align-items:flex-end;max-width:760px}
.ligne .tuile{width:36px;height:36px;border-radius:12px}
.bulle{background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:15px;line-height:1.55}
.bulle p+p{margin-top:8px}
.heure{font-size:11.5px;color:#94a0b4;margin:4px 0 0 4px}
.moi{align-self:flex-end;max-width:620px;background:var(--navy);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 16px;font-size:15px;line-height:1.5}
.moi+.heure{align-self:flex-end;margin-right:4px}
.rapides{display:flex;flex-wrap:wrap;gap:8px;margin-left:46px}
.rapides button{border:1.5px solid var(--navy);color:var(--navy);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600}
.liv{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;max-width:520px;margin-left:46px;box-shadow:0 2px 10px rgba(11,42,107,.06)}
.liv .doc{width:40px;height:48px;border-radius:9px;background:#E8EFFD;color:var(--blue);display:grid;place-items:center;flex:none}
.liv b{font-size:14.5px;display:block}.liv small{font-size:12px;color:var(--grey)}
.liv .act{margin-left:auto;display:flex;gap:6px}.liv .act button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.points{display:inline-flex;gap:4px}.points i{width:7px;height:7px;border-radius:99px;background:#9aa6b8;animation:p 1s infinite}.points i:nth-child(2){animation-delay:.15s}.points i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
.compo{margin:0 24px 18px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 24px rgba(11,42,107,.06)}
.compo input{flex:1;border:0;outline:0;font-size:15px;height:44px;background:none;min-width:0}
.compo .r{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--grey)}
.compo .env{width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center}
.cote{width:300px;flex:none;border-left:1px solid var(--line);background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.cote h3{font-size:17px}.cote p{font-size:13px;color:var(--grey);line-height:1.45}
.cote .qrb{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;place-items:center}.cote .qrb svg{width:140px;height:140px}
.doc-l{display:flex;align-items:center;gap:10px;background:#F6F8FB;border-radius:12px;padding:10px;font-size:13.5px;font-weight:600}
.doc-l .doc{width:32px;height:38px;border-radius:8px;background:#E8EFFD;color:var(--blue);display:grid;place-items:center;flex:none}
.doc-l small{display:block;font-weight:400;font-size:11.5px;color:var(--grey)}
.doc-l.attente{opacity:.5}
.doc-l button{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.vide{font-size:13px;color:var(--grey);background:#F6F8FB;border-radius:12px;padding:12px;text-align:center}
.tab-liv{flex:1;overflow:auto;padding:24px 32px}
.tab-liv .doc-l{background:#fff;border:1px solid var(--line);padding:14px;max-width:760px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:99;display:flex;gap:8px;align-items:center}
.toast svg{color:var(--lime)}
/* téléphone */
@media (max-width:760px){
 .e-haut{padding:16px 18px}.etapes-e{display:none}.e-corps{padding:10px 18px 40px;align-items:flex-start}
 .e-grille{grid-template-columns:1fr;gap:26px}.e-k{font-size:76px}.e-k small{font-size:20px}.e-lead{font-size:16px}
 .qrcard svg.qr{width:170px;height:170px}
 .choix-wrap h1{font-size:30px}.choix,.choix.q4{grid-template-columns:1fr;gap:10px;margin-top:22px}.choix button{min-height:0;flex-direction:row;align-items:center;padding:14px}.choix button small{display:none}.choix button .tuile{width:44px;height:44px}
 .app{grid-template-columns:1fr}
 .menu{position:fixed;inset:0 auto 0 0;width:84%;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
 body.menu-ouvert .menu{transform:none;box-shadow:0 0 0 100vmax rgba(11,20,43,.45)}
 .tete-tel{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
 .tete-tel .logo b{font-size:15px;color:var(--navy)}.tete-tel .logo .tuile{width:32px;height:32px}
 .page{padding:16px}.suivi{grid-template-columns:1fr}.bonjour h1{font-size:24px}
 .frise{display:flex;overflow-x:auto;gap:4px;padding:4px 2px 6px}.frise .f-et{min-width:86px}.frise:before{display:none}
 .cartes-et{grid-template-columns:1fr}
 .e-tete{padding:10px 14px;gap:10px;flex-wrap:wrap}.e-tete .tuile{width:40px;height:40px}.e-tete h2{font-size:17px}.e-tete .esp{display:none}.onglets{width:100%}.onglets button{flex:1}
 .taches{padding:10px 14px}.t{min-width:170px;flex:none}
 .cote{display:none}.fil{padding:16px 14px}.rapides,.liv{margin-left:0}.compo{margin:0 10px 10px}
 .liv{flex-wrap:wrap}.liv .act{margin-left:52px}
}
.logo{cursor:pointer}
.emo{font-size:1.05em;margin-right:4px}
.btn-appel{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;background:#16A34A;color:#fff;font-weight:600;font-family:Poppins}
.btn-appel svg{width:18px;height:18px}
.l-et{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.l-et>.h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.l-et>.h h3{font-size:18px;flex:1}.l-et>.h .cpt{font-size:13px;font-weight:600;color:var(--grey)}
.l-et .mini{height:6px;width:120px;background:#EEF1F6;border-radius:9px;overflow:hidden}.l-et .mini i{display:block;height:100%}
.l-t{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #F0F3F8}
.l-t:last-child{border-bottom:0}
.l-t .num{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:1.5px dashed #c3c9d6;color:#9aa6b8}
.l-t.fait .num{background:#E3F6EA;border:0;color:#15803d}.l-t.fait .num svg{width:15px;height:15px}
.l-t .nm{flex:1;min-width:0}.l-t .nm b{display:block;font-size:14.5px}.l-t .nm small{font-size:12px;color:var(--grey)}
.l-t:not(.fait) .nm b{color:#8a96aa;font-weight:600}
.l-t .dl{height:38px;padding:0 14px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}.l-t .dl svg{width:16px;height:16px}
.l-t .go2{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--grey)}
.filtres{display:flex;gap:8px;flex-wrap:wrap}.filtres button{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px}.filtres button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.appel-carte{margin-left:46px;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.appel-carte .hd{display:flex;align-items:center;gap:10px;font-weight:600}.appel-carte .hd .ph{width:36px;height:36px;border-radius:12px;background:#DCFCE7;color:#16A34A;display:grid;place-items:center}
.appel-carte summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13.5px;margin-top:10px;list-style:none}
.trans{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.trans div b{display:block;font-size:12px;color:var(--grey)}
.resume{background:#F6F8FB;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-top:10px}
.resume li{margin-left:18px}
.ap-l{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}
.ap-l .hd{display:flex;align-items:center;gap:12px}.ap-l .hd b{display:block;font-size:16px}.ap-l .hd small{color:var(--grey);font-size:12.5px}
.ap-grille{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-top:12px}
.ecran-appel{position:fixed;inset:0;z-index:80;background:radial-gradient(900px 600px at 50% 30%,#1D5BD8 0,#0B2A6B 60%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.ecran-appel .halo{width:170px;height:170px;border-radius:50px;display:grid;place-items:center;position:relative}
.ecran-appel .halo:before{content:"";position:absolute;inset:-18px;border-radius:64px;border:6px solid var(--hc,#B7E234);opacity:.75;animation:h 1.4s infinite}
@keyframes h{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.07);opacity:.3}}
.ecran-appel .halo svg{width:46%;height:46%}
.ecran-appel h2{font-size:26px}.ecran-appel .etat{font-weight:600;color:var(--hc,#B7E234);font-size:15px}
.ecran-appel .phrase{max-width:620px;font-size:20px;line-height:1.5;min-height:90px}
.ecran-appel .btns{display:flex;gap:18px}.ecran-appel .btns button{width:68px;height:68px;border-radius:99px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
.ecran-appel .btns button.rouge{background:#DC2626}.ecran-appel .btns svg{width:28px;height:28px}
.ecran-appel .btns button.off{background:#fff;color:#DC2626}
.ecran-appel .duree{font-size:14px;opacity:.8}
@media (max-width:760px){.ap-grille{grid-template-columns:1fr}.appel-carte{margin-left:0}.l-t .dl span{display:none}.l-et .mini{display:none}.e-tete{position:relative}.e-tete .btn-appel{position:absolute;right:14px;top:12px;width:46px;height:46px;padding:0;font-size:0;justify-content:center}.e-tete .btn-appel svg{width:20px;height:20px}.e-tete h2{padding-right:52px}}

, "rep": "Un prototype cliquable ou une feuille de route produit", "icone": "smartphone", "coul": "#F59E0B", "taches": [{"n": 10, "nom": "Prototypage", "pourquoi": "Montrer des écrans vaut mieux que mille explications pour tester ton idée.", "format": "Maquettes d'écrans cliquables, mobile ou web"}, {"n": 11, "nom": "Test du prototype", "pourquoi": "Voir de vrais utilisateurs bloquer sur ton prototype coûte moins cher que de le découvrir après le lancement.", "format": "Protocole de test et grille d'observation"}, {"n": 15, "nom": "Architecture technique", "pourquoi": "De bons choix techniques au départ t'évitent de tout reconstruire plus tard.", "format": "Document de référence en 12 sections"}, {"n": 16, "nom": "Développement du MVP", "pourquoi": "Lancer vite une première version te permet d'apprendre de vrais utilisateurs.", "format": "Plan de lancement et tableur de suivi"}, {"n": 17, "nom": "Publication sur les stores", "pourquoi": "Une fiche d'application soignée fait la différence entre être téléchargé ou ignoré.", "format": "Tableur de fiche store et de suivi"}, {"n": 34, "nom": "Feuille de route produit", "pourquoi": "Savoir quoi construire maintenant, ensuite et plus tard évite de te disperser.", "format": "Présentation de feuille de route"}]}, {"n": 6, "titre": "Trouver son modèle", "pour": "Pour la startup qui doit chiffrer son marché et fixer ses prix.", "rep": "Une taille de marché défendable devant un investisseur et une grille de prix", "icone": "trending-up", "coul": "#10A35A", "taches": [{"n": 20, "nom": "Analyse concurrentielle", "pourquoi": "Connaître tes concurrents te montre par où entrer sur le marché.", "format": "Tableur et présentation"}, {"n": 21, "nom": "Business model et prix", "pourquoi": "Un bon prix fait vivre ta startup, un mauvais la tue lentement.", "format": "Tableur de prix et canevas de business model"}, {"n": 23, "nom": "Taille de marché", "pourquoi": "Un marché chiffré et sourcé rend ton projet crédible devant un investisseur. air te dit combien lever et combien de temps tu peux tenir.", "format": "Tableur de modèle financier sur 3 ans"}]}, {"n": 9, "titre": "Lever des fonds", "pour": "Pour la startup qui se prépare à rencontrer des investisseurs.", "rep": "Un pitch deck relu et la liste des investisseurs à approcher", "icone": "rocket", "coul": "#C2185B", "taches": [{"n": 24, "nom": "Cartographie du financement", "pourquoi": "Toutes les startups ne sont pas faites pour le capital-risque : savoir laquelle tu es t'évite des mois perdus.", "format": "Document de verdict et tableur"}, {"n": 36, "nom": "Pitch deck", "pourquoi": "Ton pitch deck est souvent la première chose qu'un investisseur voit de toi.", "format": "Présentation de 10 à 12 slides"}, {"n": 37, "nom": "Stratégie de sortie", "pourquoi": "Savoir qui pourrait te racheter t'aide à construire une startup qui a de la valeur.", "format": "Note et 1 à 2 slides"}, {"n": 38, "nom": "Data room", "pourquoi": "Une data room propre rassure l'investisseur et accélère sa décision.", "format": "Data room en six dossiers et tableur de suivi"}, {"n": 39, "nom": "Pitch devant le comité d'investissement", "pourquoi": "Répéter face à des questions difficiles te prépare au vrai comité.", "format": "Script, questions-réponses et plan"}, {"n": 40, "nom": "Bilan de fin de parcours", "pourquoi": "Mesurer le chemin parcouru te dit ce qui a marché et quelle est la prochaine étape.", "format": "Tableur et document de décision"}]}], "icones": {"x": "<svg   xmlns=\"http://www.w3.org/2000/svg\"    viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <path d=\"M18 6 6 18\" />  <path d=\"m6 6 12 12\" /></svg>", "building-2": "<svg   xmlns=\"http://www.w3.org/2000/svg\"    viewBox=\"0 0 24 24\"  fill=\"none\"  stroke=\"currentColor\"  stroke-width=\"2\"  stroke-linecap=\"round\"  stroke-linejoin=\"round\">  <path d=\"M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z\" />  <path d=\"M6 12
